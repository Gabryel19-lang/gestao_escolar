<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <title>Cadastro de Alunos | 学校</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap');

        :root {
            --background: #0c0c0f;
            --surface: #17171c;
            --red: #c62835;
            --red-dark: #821b25;
            --gold: #c9a65b;
            --text: #f3eee5;
            --muted: #a5a1a1;
            --border: rgba(201, 166, 91, 0.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 30px 18px;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: 'Noto Sans JP', sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 90% 10%,
                    rgba(198, 40, 53, 0.15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 5% 90%,
                    rgba(201, 166, 91, 0.07),
                    transparent 30%
                ),
                var(--background);
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            margin-bottom: 28px;
            text-align: center;
        }

        .japanese-symbol {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--red-dark);
            border: 1px solid var(--gold);
            border-radius: 50%;

            font-size: 34px;
            font-weight: 800;
            color: white;

            box-shadow: 0 0 35px rgba(198, 40, 53, 0.15);
        }

        .header h1 {
            font-size: clamp(25px, 5vw, 34px);
            font-weight: 800;
            letter-spacing: -1px;
        }

        .header p {
            margin-top: 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .japanese-text {
            display: block;
            margin-top: 10px;

            color: var(--gold);
            font-size: 11px;
            letter-spacing: 5px;
        }

        .card {
            padding: clamp(22px, 5vw, 38px);

            background: rgba(23, 23, 28, 0.96);
            border: 1px solid var(--border);
            border-top: 3px solid var(--red);
            border-radius: 12px;

            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        }

        .card h2 {
            margin-bottom: 8px;
            font-size: 20px;
        }

        .description {
            margin-bottom: 28px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;

            color: var(--text);
            font-size: 13px;
            font-weight: 600;
        }

        .required {
            color: #e45b65;
        }

        input {
            width: 100%;
            padding: 14px 15px;

            background: #101014;
            border: 1px solid #38383f;
            border-radius: 7px;

            color: var(--text);
            font-family: inherit;
            font-size: 14px;

            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #77737a;
        }

        input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 166, 91, 0.08);
        }

        input[type="date"] {
            color-scheme: dark;
        }

        .hint {
            display: block;
            margin-top: 7px;
            color: var(--muted);
            font-size: 11px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            min-height: 48px;
            padding: 12px 16px;

            border-radius: 7px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;

            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .btn-submit {
            background: var(--red-dark);
            border: 1px solid var(--red);
            color: white;
        }

        .btn-submit:hover {
            background: var(--red);
            transform: translateY(-2px);
        }

        .btn-reset {
            background: transparent;
            border: 1px solid #45434a;
            color: var(--text);
        }

        .btn-reset:hover {
            background: #25252b;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }

        .status {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 7px;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .status.success {
            display: block;
            background: rgba(39, 130, 81, 0.14);
            border: 1px solid #278251;
            color: #8ce0ad;
        }

        .status.error {
            display: block;
            background: rgba(198, 40, 53, 0.12);
            border: 1px solid var(--red);
            color: #ff9da4;
        }

        @media (max-width: 480px) {
            .buttons {
                flex-direction: column;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header class="header">
            <div class="japanese-symbol">学</div>

            <h1>Sistema de Gestão Escolar</h1>

            
            <span class="japanese-text">学び ・ 知識 ・ 未来</span>
        </header>

        <section class="card">
            <h2>Cadastrar aluno</h2>

            <p class="description">
                Preencha os campos abaixo para registrar um novo aluno
                no sistema escolar.
            </p>

            <form id="formAluno" action="/cadastrar/aluno" method="POST">

                <div class="form-group">
                    <label for="matricula">
                        Matrícula <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="matricula"
                        name="matricula"
                        placeholder="Ex.: 2026001"
                        maxlength="20"
                        required
                    >

                    <span class="hint">
                        A matrícula deve ser única para cada aluno.
                    </span>
                </div>

                <div class="form-group">
                    <label for="nome">
                        Nome completo <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite o nome completo"
                        maxlength="100"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="data_nascimento">
                        Data de nascimento <span class="required">*</span>
                    </label>

                    <input
                        type="date"
                        id="data_nascimento"
                        name="data_nascimento"
                        required
                    >
                </div>

                <div class="buttons">
                    <button type="submit" class="btn-submit">
                        Cadastrar aluno
                    </button>

                    <button type="reset" class="btn-reset">
                        Limpar formulário
                    </button>
                </div>

                <div id="mensagem" class="status" role="status"></div>

            </form>
        </section>

        <footer class="footer">
            Sistema de Gestão Escolar · 日本の美学
        </footer>

    </main>
    <script>
    const form = document.getElementById('formAluno')
    const mensagem = document.getElementById('mensagem')

    form.addEventListener('submit', async (event) => {
        event.preventDefault()

        const botao = form.querySelector('.btn-submit')

        botao.disabled = true
        botao.textContent = 'Cadastrando...'

        mensagem.className = 'status'
        mensagem.textContent = ''

        try {
            const dadosFormulario = Object.fromEntries(
                new FormData(form).entries()
            )

            const resposta = await fetch('/cadastrar/aluno', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dadosFormulario)
            })

            const resultado = await resposta.json()

            if (!resposta.ok) {
                throw new Error(resultado.message || 'Não foi possível cadastrar.')
            }

            mensagem.className = 'status success'
            mensagem.textContent = resultado.message

            form.reset()

        } catch (erro) {
            mensagem.className = 'status error'
            mensagem.textContent = erro.message
        } finally {
            botao.disabled = false
            botao.textContent = 'Cadastrar aluno'
        }
    })
</script>
</body>
</html>
